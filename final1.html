<style>
  .fpbuild-wrap,
  .fpbuild-wrap * {
    box-sizing: border-box;
  }

  .fpbuild-wrap {
    width: 1040px;
    height: 1480px;
    max-width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #173f40;
    background: #DFF2F3;
    border: 2px solid #367879;
    border-radius: 22px;
    padding: 16px;
    scroll-behavior: smooth;
  }

  .fpbuild-work {
    display: none;
    min-height: 100%;
    flex-direction: column;
  }

  .fpbuild-work.fpbuild-active {
    display: flex;
  }

  .fpbuild-result {
    display: none;
    min-height: 100%;
    align-items: center;
    justify-content: center;
  }

  .fpbuild-result.fpbuild-active {
    display: flex;
  }

  .fpbuild-head {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    min-height: 64px;
    margin-bottom: 10px;
  }

  .fpbuild-kicker {
    display: inline-block;
    margin-bottom: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #367879;
    color: #ffffff;
    font-size: 12px;
    line-height: 1.2;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .fpbuild-head h3 {
    margin: 0;
    font-size: 23px;
    line-height: 1.12;
    color: #173f40;
  }

  .fpbuild-note {
    width: 330px;
    padding: 10px 12px;
    border-radius: 14px;
    background: #CADDDF;
    font-size: 14px;
    line-height: 1.25;
  }

  .fpbuild-task {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin-bottom: 10px;
    padding: 9px 12px;
    border-radius: 15px;
    background: rgba(255, 255, 255, .72);
  }

  .fpbuild-task-badge {
    flex: 0 0 auto;
    padding: 6px 11px;
    border-radius: 999px;
    background: #367879;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
  }

  .fpbuild-task-text {
    font-size: 14px;
    line-height: 1.28;
  }

  .fpbuild-poolbox {
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 17px;
    background: rgba(255, 255, 255, .66);
  }

  .fpbuild-wrap.fpbuild-stage-two .fpbuild-poolbox {
    display: none;
  }

  .fpbuild-pooltop {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .fpbuild-pooltitle {
    font-size: 15px;
    font-weight: 700;
    color: #367879;
  }

  .fpbuild-poolhint {
    font-size: 13px;
    color: #315c5d;
  }

  /*
   * Сохраняем исходные три колонки.
   * Карточки не растягиваются до высоты соседней карточки.
   */
  .fpbuild-pool {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: max-content;
    align-items: start;
    gap: 8px;
    max-height: 250px;
    min-height: 54px;
    overflow-y: auto;
    padding-right: 4px;
    border: 2px dashed transparent;
    border-radius: 13px;
  }

  .fpbuild-pool::-webkit-scrollbar,
  .fpbuild-slide-bank::-webkit-scrollbar,
  .fpbuild-wrap::-webkit-scrollbar {
    width: 8px;
  }

  .fpbuild-pool::-webkit-scrollbar-track,
  .fpbuild-slide-bank::-webkit-scrollbar-track,
  .fpbuild-wrap::-webkit-scrollbar-track {
    background: rgba(202, 221, 223, .45);
    border-radius: 999px;
  }

  .fpbuild-pool::-webkit-scrollbar-thumb,
  .fpbuild-slide-bank::-webkit-scrollbar-thumb,
  .fpbuild-wrap::-webkit-scrollbar-thumb {
    background: #367879;
    border-radius: 999px;
  }

  .fpbuild-pool:empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    overflow: hidden;
    border-color: #CADDDF;
    background: rgba(223, 242, 243, .55);
  }

  .fpbuild-pool:empty::before {
    content: "Все карточки размещены. Можно вернуть сюда карточку со слайда.";
    color: #5d7f80;
    font-size: 13px;
    font-weight: 700;
  }

  /*
   * Высота карточки зависит от текста.
   * Ширина остается прежней — ее задает колонка сетки.
   */
  .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    align-self: start;
    padding: 12px 13px;
    border: 1px solid #CADDDF;
    border-radius: 12px;
    background: #ffffff;
    color: #173f40;
    font-size: 14px;
    line-height: 1.28;
    cursor: grab;
    box-shadow: 0 2px 0 rgba(54, 120, 121, .12);
    user-select: none;
    white-space: normal;
    overflow: visible;
    overflow-wrap: break-word;
    word-break: normal;
  }

  .fpbuild-card:active {
    cursor: grabbing;
  }

  .fpbuild-card.fpbuild-dragging {
    opacity: .45;
  }

  .fpbuild-card.fpbuild-selected {
    outline: 2px solid #367879;
    outline-offset: 1px;
  }

  .fpbuild-tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    margin-bottom: 10px;
  }

  .fpbuild-tab {
    height: 40px;
    border: 0;
    border-radius: 12px;
    background: #CADDDF;
    color: #173f40;
    font-size: 12.4px;
    line-height: 1.1;
    font-weight: 700;
    cursor: pointer;
    padding: 5px 7px;
  }

  .fpbuild-tab.fpbuild-tab-active {
    background: #367879;
    color: #ffffff;
  }

  .fpbuild-slides {
    min-height: 390px;
    overflow: visible;
  }

  .fpbuild-slide {
    display: none;
    min-height: 390px;
    padding: 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .64);
    overflow: visible;
  }

  .fpbuild-wrap.fpbuild-stage-two .fpbuild-slides {
    min-height: 990px;
  }

  .fpbuild-wrap.fpbuild-stage-two .fpbuild-slide {
    min-height: 990px;
  }

  .fpbuild-slide.fpbuild-slide-active {
    display: block;
  }

  .fpbuild-slide-name {
    margin-bottom: 14px;
    font-size: 20px;
    line-height: 1.15;
    color: #367879;
    font-weight: 800;
  }

  /*
   * На первом этапе сохраняем две колонки.
   */
  .fpbuild-stage1-drop {
    min-height: 300px;
    padding: 12px;
    border: 2px dashed #CADDDF;
    border-radius: 16px;
    background: rgba(223, 242, 243, .58);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: max-content;
    gap: 10px;
    align-content: start;
    align-items: start;
  }

  .fpbuild-stage1-drop:empty::before {
    content: attr(data-placeholder);
    grid-column: 1 / -1;
    max-width: 760px;
    color: #6a8a8b;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 700;
  }

  .fpbuild-risk-drop:empty::before {
    max-width: 820px;
  }

  .fpbuild-stage1-drop .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    align-self: start;
    padding: 12px 13px;
    font-size: 14px;
    line-height: 1.28;
    box-shadow: none;
  }

  .fpbuild-wrap.fpbuild-stage-two .fpbuild-stage1-drop {
    display: none;
  }

  .fpbuild-stage2 {
    display: none;
  }

  .fpbuild-wrap.fpbuild-stage-two .fpbuild-stage2 {
    display: block;
  }

  .fpbuild-bank-title {
    margin-bottom: 8px;
    padding: 8px 12px;
    border-radius: 12px;
    background: #CADDDF;
    color: #173f40;
    font-size: 15px;
    font-weight: 800;
  }

  /*
   * В банке второго этапа сохраняем три колонки.
   */
  .fpbuild-slide-bank {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: max-content;
    align-items: start;
    gap: 8px;
    min-height: 70px;
    max-height: 285px;
    margin-bottom: 14px;
    padding: 10px;
    border: 2px dashed #CADDDF;
    border-radius: 14px;
    background: rgba(223, 242, 243, .58);
    overflow-y: auto;
  }

  .fpbuild-slide-bank:empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    overflow: hidden;
  }

  .fpbuild-slide-bank:empty::before {
    content: "Все данные слайда размещены";
    color: #5d7f80;
    font-size: 13px;
    font-weight: 700;
  }

  .fpbuild-slide-bank .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    align-self: start;
    padding: 11px 12px;
    font-size: 13.5px;
    line-height: 1.25;
    box-shadow: none;
  }

  .fpbuild-zone-label {
    width: 130px;
    flex: 0 0 130px;
    padding: 9px 10px;
    border-radius: 12px;
    background: #CADDDF;
    color: #173f40;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
  }

  .fpbuild-title-row,
  .fpbuild-conclusion-row,
  .fpbuild-risk-row {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 16px;
  }

  .fpbuild-section-title {
    margin: 10px 0 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: #CADDDF;
    color: #173f40;
    font-size: 15px;
    font-weight: 800;
  }

  .fpbuild-body-list {
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: max-content;
    align-items: start;
    gap: 10px;
    margin-bottom: 16px;
  }

  .fpbuild-body-list-5 {
    gap: 9px;
  }

  .fpbuild-slot {
    min-height: 58px;
    height: auto;
    padding: 9px;
    border: 2px dashed #CADDDF;
    border-radius: 14px;
    background: rgba(223, 242, 243, .58);
    transition:
      background .15s ease,
      border-color .15s ease;
  }

  .fpbuild-slot.fpbuild-over,
  .fpbuild-stage1-drop.fpbuild-over,
  .fpbuild-pool.fpbuild-over,
  .fpbuild-slide-bank.fpbuild-over {
    border-color: #367879;
    background: rgba(223, 242, 243, .95);
  }

  .fpbuild-slot.fpbuild-wrong,
  .fpbuild-card.fpbuild-wrong,
  .fpbuild-stage1-drop.fpbuild-wrong {
    border-color: #F5811F !important;
    background: rgba(245, 129, 31, .18) !important;
  }

  .fpbuild-title-slot {
    min-height: 96px;
    flex: 1;
  }

  .fpbuild-title-slot .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 14px 15px;
    font-size: 24px;
    line-height: 1.18;
    font-weight: 800;
    color: #173f40;
    box-shadow: none;
  }

  .fpbuild-body-slot {
    min-height: 66px;
  }

  .fpbuild-body-slot .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 12px 13px;
    font-size: 17px;
    line-height: 1.25;
    box-shadow: none;
  }

  .fpbuild-conclusion-slot,
  .fpbuild-risk-slot {
    min-height: 84px;
    flex: 1;
  }

  .fpbuild-conclusion-slot .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 13px 14px;
    font-size: 20px;
    line-height: 1.22;
    font-weight: 700;
    box-shadow: none;
  }

  .fpbuild-risk-label {
    background: #F5811F;
    color: #ffffff;
  }

  .fpbuild-risk-slot {
    border-color: rgba(245, 129, 31, .55);
    background: rgba(245, 129, 31, .08);
  }

  .fpbuild-risk-slot .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 13px 14px;
    font-size: 18px;
    line-height: 1.22;
    font-weight: 700;
    box-shadow: none;
  }

  .fpbuild-risk-table {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1.35fr;
    gap: 8px;
  }

  .fpbuild-table-head {
    padding: 9px 10px;
    border-radius: 12px;
    background: #367879;
    color: #ffffff;
    font-size: 14px;
    line-height: 1.1;
    font-weight: 800;
    text-align: center;
  }

  .fpbuild-table-slot {
    min-height: 98px;
    padding: 8px;
  }

  .fpbuild-table-slot .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 11px 12px;
    font-size: 14.5px;
    line-height: 1.22;
    box-shadow: none;
  }

  .fpbuild-two-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .fpbuild-list-compact .fpbuild-body-slot {
    min-height: 86px;
  }

  .fpbuild-list-compact .fpbuild-card {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 12px 13px;
    font-size: 16px;
    line-height: 1.25;
  }

  .fpbuild-footer {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 50px;
    margin-top: 12px;
  }

  .fpbuild-message {
    flex: 1;
    min-height: 42px;
    padding: 9px 12px;
    border-radius: 13px;
    background: #CADDDF;
    color: #173f40;
    font-size: 13.5px;
    line-height: 1.2;
    overflow: hidden;
  }

  .fpbuild-message.fpbuild-error {
    background: #F5811F;
    color: #ffffff;
  }

  .fpbuild-check {
    height: 42px;
    border: 0;
    border-radius: 13px;
    background: #367879;
    color: #ffffff;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .fpbuild-result-card {
    width: 88%;
    max-width: 700px;
    padding: 32px 38px;
    border-radius: 24px;
    background: #ffffff;
    border: 2px solid #367879;
    text-align: center;
    box-shadow: 0 12px 26px rgba(54, 120, 121, .18);
  }

  .fpbuild-result-icon {
    display: grid;
    place-items: center;
    width: 60px;
    height: 60px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #367879;
    color: #ffffff;
    font-size: 36px;
    font-weight: 700;
  }

  .fpbuild-result-card h3 {
    margin: 0 0 14px;
    font-size: 28px;
    color: #367879;
  }

  .fpbuild-result-card p {
    margin: 0;
    font-size: 16px;
    line-height: 1.45;
  }

  @media (max-width: 760px) {
    .fpbuild-wrap {
      width: 100%;
      height: 1480px;
      padding: 12px;
    }

    .fpbuild-head h3 {
      font-size: 18px;
    }

    .fpbuild-note {
      display: none;
    }

    /*
     * На мобильном остаются две колонки,
     * как и в исходном варианте.
     */
    .fpbuild-pool,
    .fpbuild-slide-bank {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .fpbuild-card {
      width: 100%;
      height: auto;
      min-height: 0;
      padding: 10px 11px;
      font-size: 12.5px;
      line-height: 1.25;
    }

    .fpbuild-tabs {
      grid-template-columns: repeat(3, 1fr);
    }

    .fpbuild-stage1-drop {
      grid-template-columns: 1fr;
      min-height: 300px;
    }

    .fpbuild-zone-label {
      width: 100px;
      flex-basis: 100px;
      font-size: 12px;
    }

    .fpbuild-title-slot .fpbuild-card {
      font-size: 18px;
    }

    .fpbuild-body-slot .fpbuild-card {
      font-size: 14px;
    }

    .fpbuild-conclusion-slot .fpbuild-card,
    .fpbuild-risk-slot .fpbuild-card {
      font-size: 15.5px;
    }

    .fpbuild-risk-table {
      grid-template-columns: 1fr;
    }

    .fpbuild-table-head {
      display: none;
    }

    .fpbuild-two-cols {
      grid-template-columns: 1fr;
      gap: 10px;
    }
  }
</style>
